[package]
name = "tortuga-helper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arti-client = { version = "=0.48.0", features = ["full", "experimental-api", "geoip"] }
tor-proto = { version = "=0.48.0", features = ["stream-ctrl"] }
tor-linkspec = "=0.48.0"
tor-geoip = "=0.48.0"
tor-rtcompat = "=0.48.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
librqbit = "=9.1.0"
librqbit-core = "=9.1.0"
base64 = "0.22"
reqwest = { version = "=0.13.5", features = ["json", "socks"] }
anyhow = "1"
