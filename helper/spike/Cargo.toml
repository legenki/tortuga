[package]
name = "arti-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arti-client = { version = "=0.48.0", features = ["full", "experimental-api", "geoip"] }
tor-proto = { version = "=0.48.0", features = ["stream-ctrl"] }
tor-linkspec = "=0.48.0"
tor-geoip = "=0.48.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
