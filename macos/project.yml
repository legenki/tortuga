name: Tortuga
options:
  bundleIdPrefix: org.tortuga
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  TortugaKit:
    path: Packages/TortugaKit
  TortugaUI:
    path: Packages/TortugaUI
  TortugaProxyKit:
    path: Packages/TortugaProxyKit
targets:
  Tortuga:
    type: application
    platform: macOS
    sources: [Tortuga]
    dependencies:
      - package: TortugaKit
      - package: TortugaUI
      - package: TortugaProxyKit
      - target: TortugaProxy
    info:
      path: Tortuga/Info.plist
      properties:
        CFBundleDisplayName: Tortuga
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Tortuga contributors
        TortugaProxyMachService: $(DEVELOPMENT_TEAM).org.tortuga.app.proxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tortuga.app
        PRODUCT_NAME: Tortuga
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: $(TORTUGA_APP_ENTITLEMENTS)
  TortugaProxy:
    type: system-extension
    platform: macOS
    sources: [TortugaProxy]
    dependencies:
      - package: TortugaKit
      - package: TortugaProxyKit
    info:
      path: TortugaProxy/Info.plist
      properties:
        CFBundleDisplayName: Tortuga Proxy
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "5"
        TortugaTeamID: $(DEVELOPMENT_TEAM)
        NSSystemExtensionUsageDescription: Sends this Mac's traffic through Tor.
        NetworkExtension:
          NEMachServiceName: $(DEVELOPMENT_TEAM).org.tortuga.app.proxy
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).TransparentProxy
            com.apple.networkextension.dns-proxy: $(PRODUCT_MODULE_NAME).DNSProxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tortuga.app.proxy
        PRODUCT_NAME: org.tortuga.app.proxy
        PRODUCT_MODULE_NAME: TortugaProxy
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: $(TORTUGA_PROXY_ENTITLEMENTS)
    postBuildScripts:
      - name: Embed tortuga-helper and lyrebird
        script: '"$SRCROOT/scripts/embed-helper.sh"'
        basedOnDependencyAnalysis: false
  TortugaAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [TortugaAppUITests]
    dependencies:
      - target: Tortuga
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tortuga.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Tortuga
schemes:
  Tortuga:
    build:
      targets:
        Tortuga: all
        TortugaAppUITests: [test]
    test:
      targets:
        - TortugaAppUITests
